<style>
/* Concept: one flat SVG canvas, stages cross-fade, the recommendation pipeline pans along a wide strip. */
:root{
  color-scheme:dark;
  --bg:#070D18; --glass:rgba(14,24,41,.78); --line:rgba(140,170,210,.22); --ink:#EAF1F8; --ink2:#9DB1CB;

  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#0d1a2f 0%,#070D18 70%)}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;user-select:none;-webkit-user-select:none}
#stage text{pointer-events:none}
.stg{transition:opacity .4s}
.hud{position:fixed;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
.top{left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px clamp(16px,3vw,28px)}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font:700 18px/1 var(--f-display);letter-spacing:-.01em}
.samp{font:500 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);border:1px dashed var(--line);border-radius:99px;padding:5px 8px}
.tools{display:flex;gap:8px}
.btn{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:500;font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);color:#06121C;border-color:var(--accent)}
.cap{left:clamp(16px,3vw,28px);right:clamp(16px,3vw,28px);top:calc(env(safe-area-inset-top,0px) + 64px);pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.cap-l{min-width:0}
.story{flex:0 0 min(360px,40vw);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 13px;display:grid;gap:7px;font-size:12.5px;line-height:1.38;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.story:empty{display:none}
.story .r{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px}
.story .k{font:600 10px/1.9 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.story .k.w{color:var(--amber)}
.story .v{color:var(--ink)}
.cap h1{margin:0;font:700 clamp(24px,min(4vw,6.2vh),46px)/1.05 var(--f-display);letter-spacing:-.025em;text-wrap:balance;max-width:24ch;text-shadow:0 2px 24px rgba(7,13,24,.9)}
.cap p{margin:8px 0 0;font:500 13px var(--f-mono);letter-spacing:.04em;color:var(--accent);text-transform:uppercase;text-shadow:0 2px 12px rgba(7,13,24,.9)}
.ctl{left:clamp(16px,3vw,28px);right:clamp(16px,3vw,28px);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);display:flex;gap:10px;flex-wrap:wrap;align-items:center;pointer-events:none}
.ctl>*{pointer-events:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:inline-flex;align-items:center;gap:7px}
button.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip i.sq{border-radius:2px}
.chip i.hol{background:transparent!important;border:2px dashed currentColor}
.steps{left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center;padding:14px clamp(12px,3vw,28px);pointer-events:none}
.steps>div{pointer-events:auto;display:flex;gap:4px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:5px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:100%;overflow-x:auto;scrollbar-width:none}
.steps>div::-webkit-scrollbar{display:none}
.stp{background:none;border:0;border-radius:10px;padding:8px 12px;font-weight:500;font-size:13px;color:var(--ink2);white-space:nowrap;display:flex;gap:7px;align-items:center}
.stp:hover{color:var(--ink)}
.stp[aria-current="step"]{background:var(--accent);color:#06121C}
.stp i{font:600 10.5px/1 var(--f-mono);font-style:normal;opacity:.75}
.arr{padding:8px 10px}
#tip{position:fixed;z-index:9;pointer-events:none;background:rgba(7,13,24,.95);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;max-width:260px;display:none}
#tip b{display:block;font-weight:600}
#tip span{color:var(--ink2);font-size:12.5px}
.grp{font:600 9.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:0 8px 0 10px;border-left:1px solid var(--line);margin-left:4px;white-space:nowrap}
.chip.primary{background:var(--accent);color:#06121C;border-color:var(--accent)}
@media (max-width:760px){.cap{flex-direction:column;gap:10px}.story{flex:none;width:100%}}
@media (max-width:640px){.stp i{display:none}.cap h1{max-width:14ch}.btn{padding:7px 10px}}
</style>

/* ======================= HUD / NAV ======================= */

const STORY={
  "-2":[["WHAT","A skill ontology is your company's map of every skill it hires for, how skills relate, and what each job needs."],["HOW","Built from your own interviews, saved once, searched by every use case."]],
  "-1":[["IN","Interview transcripts and each job's title"],["OUT","A skill ontology, saved once per company"],["WHY","Every use case searches it. Nothing is rebuilt."]],
  0:[["IN","Interview recordings and the job descriptions"],["OUT","Every interview filed under the right job"],["WHY","A mis-filed interview would teach the wrong skills"]],
  1:[["IN","Interviews filed by job"],["OUT","One list of skills, one name each, and what each job needs"],["WHY","A shared language of skills, learned from your own hiring"]],

  3:[["IN","A request from a use case"],["OUT","Answers found by searching the database"],["WHY","New use cases reuse the same foundation. Nothing is copied"]],
  5:[["NOW","Start with candidate recommendation (Phase 1)"],["NEXT","Search, job checks, interview guides and more reuse the same foundation"]]
};
function adjList(){
  const b=bp(ROLE),inBp=new Set(b.map(x=>x.id)),core=b.filter(x=>x.cls==="C").map(x=>x.id),adj={};
  core.forEach(id=>NB[id].filter(nn=>nn.type==="R"&&!inBp.has(nn.id)).forEach(nn=>{if(!adj[nn.id]||adj[nn.id].w<nn.w)adj[nn.id]={id:nn.id,from:id,w:nn.w}}));
  return Object.values(adj).sort((a,c)=>c.w-a.w).slice(0,6);
}
function recStory(j){
  const b=bp(ROLE),nC=b.filter(x=>x.cls==="C").length,nS=b.filter(x=>x.cls==="S").length,job=ROLES[ROLE].title;
  const gated=POOL.filter(c=>c.gate).length,elig=POOL.length-gated;
  const top=POOL.map(scoreC).filter(x=>!x.c.gate&&x.score>0).sort((a,c)=>c.score-a.score)[0];
  return [
    [["IN","A recruiter opens a workflow for "+job],["OUT",nC+" must-have and "+nS+" nice-to-have skills"],["WHY","The job is read from what your company really assesses"]],
    [["IN","Those "+(nC+nS)+" skills"],["OUT","Their other names, plus "+adjList().length+" related skills"],["WHY","'k8s' and 'Kubernetes' count as one. Close skills earn partial credit"]],
    [["IN","The widened skill list"],["OUT",POOL.length+" people, each with evidence per skill"],["WHY","Proof from an interview counts more than a résumé claim"]],
    [["IN",POOL.length+" people"],["OUT",elig+" eligible, "+gated+" held back"],["WHY","Consent, blacklist, cool-off and retention rules apply before anyone is ranked"]],
    [["IN","Eligible people and their evidence"],["OUT","A ranked shortlist"+(top?". "+top.c.name+" leads at "+Math.round(top.score):"")],["WHY","Each score comes with its reason"]]
  ][j];
}
const SUBCAP=[
  ["Read the job","Search: the job's must-have skills"],
  ["Widen with the skill map","Search: other names and related skills"],
  ["Find people with evidence","Search: each person's proven skills"],
  ["Remove anyone not eligible","Search: consent, blacklist, cool-off, retention"],
  ["Rank with reasons","Hover a bar"]
];
const SEQ=[[-2,0],[-1,0],[0,0],[1,0],[2,0],[3,0],[4,0],[4,1],[4,2],[4,3],[4,4],[5,0]];
const HASHES=["why","flow","match","learn","save","usecases","recommendation","summary"];
let cur=-2,sub=0;
const stageOf=i=>i===-2?6:i===-1?5:i===5?7:i;
function setStory(){
  const rows=cur===4?recStory(sub):(STORY[cur]||[]);
  $("#story").innerHTML=rows.map(r=>`<div class="r"><span class="k${r[0]==="WHY"?" w":""}">${r[0]}</span><span class="v">${esc(r[1])}</span></div>`).join("");
}
function setCaption(){
  if(cur===4){$("#cap").textContent=SUBCAP[sub][0];$("#hint").textContent=SUBCAP[sub][1]}
  else{$("#cap").textContent=CAPS[cur][0];$("#hint").textContent=CAPS[cur][1]}
  setStory();layoutStage();
}
function applyRecCam(){
  if(cur===4){rec.ps=Math.min(VW*.94/540,VH*.97/510,2.6);rec.px=600-REC_XS[sub]*rec.ps;rec.py=360}
  else{rec.ps=.34;rec.px=600-1090*.34;rec.py=360}
}
function goStage(i,keep,s){
  cur=i;if(i===4)sub=s==null?0:s;
  gs.forEach((g,k)=>{const on=k===stageOf(i);g.setAttribute("opacity",on?1:0);g.setAttribute("pointer-events",on?"auto":"none")});
  setCaption();
  document.querySelectorAll(".stp").forEach(b=>b.setAttribute("aria-current",String(+b.dataset.i===i)));
  if(i===0){mt.t=0;mt.cards.forEach(c=>{c.arrived=false;c.released=false})}
  if(i===1){lrn.t=0;lrn.sel=null;lrn.autoAt=3.2;lrnRefresh()}
  if(i===3)hubRefresh();
  if(i===4)rec.T[sub]=0;

  buildCtl();
  try{history.replaceState(null,"","#"+HASHES[i+2])}catch(e){}

function goSub(j){sub=j;rec.T[j]=0;applyRecCam();setCaption();buildCtl()}
function buildCtl(){
  const c=$("#ctl");let h="";
  const roles=(all,label)=>`<div class="chips" role="group" aria-label="Role">${label?`<span class="chip">${label}</span>`:""}`+(all?`<button class="chip" data-role="all" aria-pressed="${lrn.all}">All roles</button>`:"")+Object.keys(ROLEN).map(k=>`<button class="chip" data-role="${k}" aria-pressed="${k===ROLE&&!(all&&lrn.all)}"><i style="background:${ROLEC[k]}"></i>${ROLEN[k]}</button>`).join("")+`</div>`;
  const nA=TAGS.filter(t=>t[2]==="auto").length,nR=TAGS.filter(t=>t[2]==="review").length,nH=TAGS.filter(t=>t[2]==="held").length;
  if(cur===-2)h=`<div class="chips"><button class="chip primary" data-next="1">Start the walkthrough →</button></div>`;

  if(cur===2)h=`<div class="chips"><span class="chip"><i style="background:${PARTC.graph}"></i>Skills and how they relate</span><span class="chip"><i style="background:${PARTC.jobs}"></i>Jobs</span><span class="chip"><i style="background:${PARTC.cand}"></i>People</span><span class="chip"><i style="background:${PARTC.elig}"></i>Rules</span></div>`;
  if(cur===3){
    const u=UCS[hub.sel];
    h=`<div class="chips"><span class="chip" style="border-color:var(--accent)">${esc(u[0])}</span><span class="chip">Searches</span>`+u[3].map(k=>`<span class="chip"><i style="background:${PARTC[k]}"></i>${PARTN[k]}</span>`).join("")+`</div><div class="chips">`+(hub.sel===0?`<button class="chip primary" data-open="rec">See how it works →</button>`:`<span class="chip">Step-by-step breakdown coming next</span>`)+`</div>`;
  }
  if(cur===4){
    h=`<div class="chips" role="group" aria-label="Step">`+["Read job","Widen","Find people","Check","Rank"].map((n,i)=>`<button class="chip" data-sub="${i}" aria-pressed="${i===sub}">${i+1} ${n}</button>`).join("")+`</div>`+roles(false,"Open workflow for")+
      `<div class="chips">`+(sub>=1&&sub<=4?`<button class="chip" id="adjBtn" aria-pressed="${REC.adj}">Use related skills</button>`:"")+(sub===4?`<button class="chip" id="decayBtn" aria-pressed="${REC.decay}">Recent counts more</button><span class="chip"><i class="sq" style="background:${EVC.V}"></i>Proven in interview</span><span class="chip"><i class="sq" style="background:${EVC.D}"></i>Shown in assessment</span><span class="chip"><i class="sq hol" style="color:#8CA39E"></i>Stated on résumé</span><span class="chip"><i class="sq hol" style="color:#6CD0F5"></i>Related skill</span>`:"")+(sub===2?`<span class="chip"><i style="background:${EVC.V}"></i>Proven</span><span class="chip"><i style="background:${EVC.D}"></i>Shown</span><span class="chip"><i class="hol" style="color:#8CA39E"></i>Stated</span><span class="chip"><i class="hol" style="color:#6CD0F5"></i>Related</span><span class="chip"><i style="background:#2A3B57"></i>None</span>`:"")+`</div>`;
  }
  if(cur===5)h=`<div class="chips"><button class="chip" data-restart="1">Replay from the start</button></div>`;
  c.innerHTML=h;layoutStage();
}
$("#ctl").addEventListener("click",e=>{
  const r=e.target.closest("[data-role]");
  if(r){
    if(r.dataset.role==="all")lrn.all=true;else{ROLE=r.dataset.role;lrn.all=false}
    if(cur===1){lrn.sel=null;lrn.autoAt=lrn.t+1.8;lrnRefresh()}

(function(){

    ["Match","Learn","Save"].map((n,i)=>`<button class="stp" data-i="${i}"><i>${i+1}</i>${n}</button>`).join("")+`<span class="grp">Use</span><button class="stp" data-i="3">Use cases</button><button class="stp" data-i="4">Recommendation</button><span class="grp"></span><button class="stp" data-i="5">Summary</button><button class="stp arr" data-d="1" aria-label="Next">›</button>`;

function seqIndex(){return SEQ.findIndex(q=>q[0]===cur&&(cur!==4||q[1]===sub))}
function step(d){const n=SEQ[(seqIndex()+d+SEQ.length)%SEQ.length];goStage(n[0],false,n[1])}

/* ---------- drawing area sits between caption and controls ---------- */
let VW=1200,VH=520;

  const cap=$("#capwrap").getBoundingClientRect(),ctl=$("#ctl"),stp=$(".steps>div").getBoundingClientRect();

let last=performance.now();
function frame(now){
